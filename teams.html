<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teams - Asık Veysel MUN 2026</title>
<link rel="stylesheet" href="style.css">
<!---------------------------------------------------------------------------------------------------------------------------------------------->
<style>
body {
  margin: 0;
  overflow-y: auto;
  background: transparent;
}

h1.teams-title {
  text-align: center;
  margin-top: 140px;
  font-size: 42px;
  letter-spacing: 3px;
  color: white;
}

.teams-container {
  width: 80%;
  max-width: 900px;
  margin: 80px auto 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  position: relative;
}

.arrow {
  background: transparent;
  border: none;
  color: white;
  font-size: 44px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 10px;
  transition: transform .15s ease;
}

.arrow:active { 
  transform: scale(.96); 
}

.team-card {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border-radius: 18px;
  padding: 28px;
  display: flex;
  gap: 20px;
  align-items: center;
  min-height: 240px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.25);
  overflow: hidden;
}

.team-card img {
  width: 220px;
  height: 220px;
  object-fit: cover;
  border-radius: 12px;
  border: 3px solid rgba(255,255,255,0.12);
  flex-shrink: 0;
}

.team-info { 
  color: white; 
  text-align: left; 
}

.team-info h2 { 
  font-size: 26px; 
  margin: 0 0 8
  px; 
}
.team-info p { 
  margin: 0; 
  line-height: 1.6; 
  opacity: 0.95; 
}

@keyframes slideOutLeft { to { transform: translateX(-60px); opacity: 0; } }
@keyframes slideOutRight { to { transform: translateX(60px); opacity: 0; } }
@keyframes slideInFromRight { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes slideInFromLeft { from { transform: translateX(-60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.animate-out-left { 
  animation: slideOutLeft .36s ease forwards; 
}
.animate-out-right { 
  animation: slideOutRight .36s ease forwards; 
}
.animate-in-right { 
  animation: slideInFromRight .36s ease forwards; 
}
.animate-in-left { 
  animation: slideInFromLeft .36s ease forwards; 
}

@media (max-width:700px) {
  .teams-container { 
    width: 92%; 
    gap: 10px; 
    margin-top: 60px; 
    margin-bottom: 100px; 
    flex-direction: column; 
  }
  .team-card { 
    flex-direction: column; 
    padding: 18px; 
    min-height: auto; 
  }
  .team-card img { 
    width: 160px; 
    height: 160px; 
  }
  .arrow { 
    font-size: 34px; 
  }
  h1.teams-title {
    margin-top: 80px; 
  }
  .teams-container { 
    margin-top: 40px; 
    margin-bottom: 80px; 
  } 
}

.hamburger {
  display: none;
  flex-direction: column;
  justify-content: space-around;
  width: 30px;
  height: 22px;
  cursor: pointer;
  z-index: 101;
}

.hamburger span {
  height: 3px;
  width: 100%;
  background: #fff;
  border-radius: 3px;
  transition: all 0.3s ease;
}

.hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

@media (max-width:800px) {
  .nav-links {
    position: fixed;
    right: -100%;
    top: 70px;
    height: 100vh;
    width: 60%;
    background: #000f46c4;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    padding-top: 2rem;
    transition: right 0.3s ease;
    z-index: 100;
  }
  .nav-links.active { 
    right: 0; 
  }
  .hamburger { 
    display: flex; 
  }
  .nav-links li { 
    opacity: 0; 
    transition: opacity 0.3s ease 0.2s; 
  }
  .nav-links.active li {
    opacity: 1; 
  }
}
</style>
<!---------------------------------------------------------------------------------------------------------------------------------------------->
</head>
<body>

  <div class="header finisher-header"></div>

  <nav class="navbar">
    <div class="logo">
      <img src="img/1.png" alt="Logo">
      <span>ASKMUN'26</span>
    </div>
    <div class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="committees.html">Committees</a></li>
      <li><a href="teams.html" class="active">Teams</a></li>
      <li><a href="heads.html">Heads</a></li>
      <li><a href="location.html">Location</a></li>
      <li><a href="mailto:asikveyselmun@gmail.com">Contact</a></li>
    </ul>
  </nav>

  <section>
    <h1 class="teams-title">TEAMS</h1>
    <div class="teams-container" aria-live="polite">
      <button class="arrow" id="prev" aria-label="Önceki Takım">&#10094;</button>
      <div class="team-card" id="teamCard" role="region" aria-roledescription="carousel">
        <img src="img/7.png" alt="Team 1">
        <div class="team-info">
          <h2>ÖRNEK 1</h2>
          <p>Bu yazı örnek açıklamadır ve tasarım için önem arz etmektedir.</p>
        </div>
      </div>
      <button class="arrow" id="next" aria-label="Sonraki Takım">&#10095;</button>
    </div>
  </section>
<!---------------------------------------------------------------------------------------------------------------------------------------------->
  <script src="finisher-header.es5.min.js"></script>
  <script class="finisher-header">
    new FinisherHeader({
      "count": 10,
      "size": { "min": 1300, "max": 1500, "pulse": 0 },
      "speed": { "x": { "min": 0.1, "max": 0.6 }, "y": { "min": 0.1, "max": 0.6 } },
      "colors": { "background": "#16002c", "particles": ["#393f4b","#2800dc","#2800dc","#000000","#160078"] },
      "blending": "overlay",
      "opacity": { "center": 0.5, "edge": 0.05 },
      "skew": 0,
      "shapes": ["c"]
    });
  </script>

  <script>
  
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.querySelector('.nav-links');
    hamburger.addEventListener('click', () => {
      navLinks.classList.toggle('active');
      hamburger.classList.toggle('open');
    });

    (function(){
      const teams = [
        { img: "img/7.png", name: "ÖRNEK 1", desc: "Bu yazı örnek açıklamadır ve tasarım için önem arz etmektedir." },
        { img: "img/7.png", name: "ÖRNEK 2", desc: "Bu yazı örnek açıklamadır ve tasarım için önem arz etmektedir." },
        { img: "img/7.png", name: "ÖRNEK 3", desc: "Bu yazı örnek açıklamadır ve tasarım için önem arz etmektedir." }
      ];
      let current = 0;
      let isAnimating = false;
      const card = document.getElementById("teamCard");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");

      function render(index){
        const t = teams[index];
        card.innerHTML = `<img src="${t.img}" alt="${t.name}"><div class="team-info"><h2>${t.name}</h2><p>${t.desc}</p></div>`;
      }

      render(current);

      function change(direction){
        if(isAnimating) return;
        isAnimating = true;
        const outClass = direction === 1 ? "animate-out-left" : "animate-out-right";
        const inClass  = direction === 1 ? "animate-in-right" : "animate-in-left";
        card.classList.add(outClass);

        function onOut(){
          card.removeEventListener("animationend", onOut);
          current = (current + direction + teams.length) % teams.length;
          render(current);
          card.classList.remove(outClass);
          void card.offsetWidth;
          card.classList.add(inClass);
          function onIn(){
            card.removeEventListener("animationend", onIn);
            card.classList.remove(inClass);
            isAnimating = false;
          }
          card.addEventListener("animationend", onIn);
        }
        card.addEventListener("animationend", onOut);
      }

      prev.addEventListener("click", () => change(-1));
      next.addEventListener("click", () => change(1));
      document.addEventListener("keydown", (e) => { if(e.key==="ArrowLeft") prev.click(); if(e.key==="ArrowRight") next.click(); });
    })();
  </script>
  <!---------------------------------------------------------------------------------------------------------------------------------------------->
</body>
</html>
