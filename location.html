<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location - Asık Veysel MUN 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 🔹 Finisher Header Arka Plan -->
  <div class="header finisher-header"></div>

  <!-- 🔹 Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img src="img/1.png" alt="Logo">
      <span>ASKMUN'26</span>
    </div>

    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="committees.html">Committees</a></li>
      <li><a href="teams.html">Teams</a></li>
      <li><a href="heads.html">Heads</a></li>
      <li><a href="location.html" class="active">Location</a></li>
      <li><a href="mailto:asikveyselmun@gmail.com">Contact</a></li>
    </ul>
  </nav>

  <!-- 🔹 Venue Section -->
  <section class="venue-section">
    <h1 class="venue-title">School Location</h1>
    <a href="https://maps.app.goo.gl/qBu2w9hLNPGu8M5YA" target="_blank" class="map-button">Location</a>
    <div class="venue-photos">
      <img src="img/7.png" alt="1">
      <img src="img/7.png" alt="2">
      <img src="img/7.png" alt="3">
      <img src="img/7.png" alt="4">
    </div>
  </section>

  <!-- 🔹 Finisher Script -->
  <script src="finisher-header.es5.min.js" type="text/javascript"></script>
  <script class="finisher-header" type="text/javascript">
    new FinisherHeader({
      "count": 10,
      "size": { "min": 1300, "max": 1500, "pulse": 0 },
      "speed": { "x": { "min": 0.1, "max": 0.6 }, "y": { "min": 0.1, "max": 0.6 } },
      "colors": {
        "background": "#16002c",
        "particles": ["#393f4b", "#2800dc", "#2800dc", "#000000", "#160078"]
      },
      "blending": "overlay",
      "opacity": { "center": 0.5, "edge": 0.05 },
      "skew": 0,
      "shapes": ["c"]
    });
  </script>

  <!-- 🔹 Hamburger Menu Script -->
  <script>
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.querySelector('.nav-links');

    hamburger.addEventListener('click', () => {
      navLinks.classList.toggle('active');
      hamburger.classList.toggle('open');
    });
  </script>

  <!-- 🔹 Venue Section Style (Inline) -->
  <style>
    html, body {
      height: 100%;
      min-height: 100vh;
      overflow: auto;
    }

    .venue-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 100px 20px;
      gap: 40px;
      min-height: calc(100vh - 70px); /* navbar yüksekliğini çıkar */
      z-index: 1;
      position: relative;
    }

    .venue-title {
      color: white;
      font-size: 2.5rem;
      text-align: center;
    }

    .map-button {
      background-color: #001a76;
      color: white;
      padding: 15px 30px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 1.2rem;
      transition: background 0.3s;
    }

    .map-button:hover {
      background-color: #131d40;
    }

    .venue-photos {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .venue-photos img {
      width: 250px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
    }

    /* 🔹 Responsive */
    @media (max-width: 800px) {
      .venue-title {
        font-size: 1.8rem;
      }
      .map-button {
        padding: 12px 25px;
        font-size: 1rem;
      }
      .venue-photos img {
        width: 180px;
        height: 120px;
      }
    }
  </style>
</body>
</html>
